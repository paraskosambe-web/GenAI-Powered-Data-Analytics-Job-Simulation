<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-label="Animated workflow: data pipeline, decision engine, action layer, learning loop" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b0f"/>
      <stop offset="100%" stop-color="#2a2f3a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="210" rx="18" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 40H900M0 80H900M0 120H900M0 160H900"/>
    <path d="M100 0V210M200 0V210M300 0V210M400 0V210M500 0V210M600 0V210M700 0V210M800 0V210"/>
  </g>

  <!-- return (learning loop) path -->
  <path id="loop" d="M 780 112 C 780 192, 120 192, 120 112" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 8" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="3s" repeatCount="indefinite"/>
  </path>
  <polygon points="120,112 114,124 126,124" fill="#6b7280"/>
  <text x="450" y="204" text-anchor="middle" fill="#9ca3af" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2">CLOSED-LOOP OPTIMIZATION</text>

  <!-- forward path (hidden guide for the moving dot) -->
  <path id="fwd" d="M 120 76 L 780 76" fill="none" stroke="none"/>

  <!-- arrows between nodes -->
  <g stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6">
    <line x1="206" y1="76" x2="254" y2="76"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="426" y1="76" x2="474" y2="76"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/></line>
    <line x1="646" y1="76" x2="694" y2="76"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.2s" repeatCount="indefinite"/></line>
  </g>
  <g fill="#9ca3af">
    <polygon points="256,76 248,71 248,81"/>
    <polygon points="476,76 468,71 468,81"/>
    <polygon points="696,76 688,71 688,81"/>
  </g>

  <!-- nodes -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="40" y="40" width="160" height="72" rx="12" fill="#1f2937" stroke="#4b5563" stroke-width="1.5"/>
      <rect x="40" y="40" width="160" height="72" rx="12" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0" filter="url(#glow)">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.06;0.2;1" dur="9s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="120" y="68" fill="#f3f4f6" font-size="13" font-weight="700" letter-spacing="1">DATA PIPELINE</text>
      <text x="120" y="90" fill="#9ca3af" font-size="11">Real-time ingestion</text>
    </g>
    <g>
      <rect x="260" y="40" width="160" height="72" rx="12" fill="#1f2937" stroke="#4b5563" stroke-width="1.5"/>
      <rect x="260" y="40" width="160" height="72" rx="12" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0" filter="url(#glow)">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.06;0.2;1" dur="9s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <text x="340" y="68" fill="#f3f4f6" font-size="13" font-weight="700" letter-spacing="1">DECISION ENGINE</text>
      <text x="340" y="90" fill="#9ca3af" font-size="11">Hybrid model + SHAP</text>
    </g>
    <g>
      <rect x="480" y="40" width="160" height="72" rx="12" fill="#1f2937" stroke="#4b5563" stroke-width="1.5"/>
      <rect x="480" y="40" width="160" height="72" rx="12" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0" filter="url(#glow)">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.06;0.2;1" dur="9s" begin="3s" repeatCount="indefinite"/>
      </rect>
      <text x="560" y="68" fill="#f3f4f6" font-size="13" font-weight="700" letter-spacing="1">ACTION LAYER</text>
      <text x="560" y="90" fill="#9ca3af" font-size="11">Targeted interventions</text>
    </g>
    <g>
      <rect x="700" y="40" width="160" height="72" rx="12" fill="#1f2937" stroke="#4b5563" stroke-width="1.5"/>
      <rect x="700" y="40" width="160" height="72" rx="12" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0" filter="url(#glow)">
        <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.06;0.2;1" dur="9s" begin="4.5s" repeatCount="indefinite"/>
      </rect>
      <text x="780" y="68" fill="#f3f4f6" font-size="13" font-weight="700" letter-spacing="1">LEARNING LOOP</text>
      <text x="780" y="90" fill="#9ca3af" font-size="11">30 / 60 / 90-day feedback</text>
    </g>
  </g>

  <!-- forward data dot -->
  <circle r="6" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear">
      <mpath href="#fwd"/>
    </animateMotion>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- return feedback dot -->
  <circle r="6" fill="#3b82f6" filter="url(#glow)">
    <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;0;1" keyTimes="0;0.5;1" calcMode="linear">
      <mpath href="#loop"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.51;1" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>
